name: Kurser
on:
  schedule:
    - cron: "7 0-21 * * 1-5"   # én gang i timen på hverdage (UTC); jobbet henter selv hvert 15. min. (GitHub kører */15 for sjældent)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["hent.py", "tickere.json", "requirements.txt", ".github/workflows/kurser.yml"]
permissions:
  contents: write
concurrency:
  group: kurser
  cancel-in-progress: true
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Hent og gem hvert 15. min. i en time
        run: |
          git config user.name "kurser-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4; do
            python hent.py || echo "hent fejlede (runde $i)"
            git add docs/data
            if ! git diff --cached --quiet; then
              git commit -q -m "Kurser $(date -u +%FT%H:%MZ)"
              git pull -q --rebase -X theirs || true
              git push -q || echo "push fejlede (runde $i)"
            fi
            [ "$i" -lt 4 ] && [ "${{ github.event_name }}" = "schedule" ] && sleep 840 || break
          done

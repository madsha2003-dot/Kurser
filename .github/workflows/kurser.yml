name: Kurser
on:
  schedule:
    - cron: "*/15 0-21 * * 1-5"   # hvert 15. min. på hverdage fra Tokyos åbning til USA's lukning (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["hent.py", "tickere.json", "requirements.txt", ".github/workflows/kurser.yml"]
permissions:
  contents: write
concurrency:
  group: kurser
  cancel-in-progress: true
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python hent.py
      - name: Gem
        run: |
          git config user.name "kurser-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Kurser $(date -u +%FT%H:%MZ)"
          git pull -q --rebase -X theirs || true
          git push -q
